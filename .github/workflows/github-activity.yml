name: Daily public GitHub activity
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-github-activity
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public data contract
        run: node prototypes/3d-face/scripts/test_public_activity.mjs
      - name: Refresh once per UTC day
        id: refresh
        continue-on-error: true
        run: node prototypes/3d-face/scripts/refresh_github_activity.mjs
      - name: Preserve successful data and refresh status
        run: |
          git add -- prototypes/3d-face/assets/github-public.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public GitHub activity snapshot'
            git push
          fi
      - name: Report a source failure after preserving the fallback
        if: steps.refresh.outcome == 'failure'
        run: exit 1
